name: CD

# 打 tag 时构建插件包并发布到 GitHub Release
on:
  push:
    tags:
      - "v*"

jobs:
  cd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: ui

      - name: 校验插件清单
        run: npm run validate
        working-directory: ui

      - name: 类型检查
        run: npm run type-check
        working-directory: ui

      - name: 构建前端
        run: npm run build
        working-directory: ui

      - name: 打包插件
        run: npm run package
        working-directory: ui

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
