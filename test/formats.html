<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>halo-plugin-3d 模型格式支持测试</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }
      h1 {
        font-size: 18px;
      }
      h2 {
        margin: 24px 0 8px;
        font-size: 14px;
        color: #374151;
      }
      .note {
        max-width: 820px;
        font-size: 13px;
        line-height: 1.7;
        color: #4b5563;
      }
      #report {
        margin-top: 20px;
        padding: 12px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        line-height: 1.9;
        white-space: pre-wrap;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
      }
      .pass {
        color: #047857;
      }
      .fail {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <h1>模型格式支持测试</h1>
    <p class="note">
      逐个验证运行时对各种模型格式的支持情况。重点看
      <b>Draco 压缩的 glTF</b>——之前这里会报
      <code>No DRACOLoader instance provided.</code>。
    </p>

    <h2>1. OBJ + MTL</h2>
    <div
      data-halo-3d-model="true"
      data-src="/fixtures/cube.obj"
      data-mtl-src="/fixtures/cube.mtl"
      data-name="cube.obj"
      data-width="100%"
      data-height="300px"
      data-theme="light"
      data-autorotate="false"
      data-background="solid"
      data-grid="true"
      data-controls="true"
      style="position:relative;display:block;width:100%;height:300px;overflow:hidden"
    ></div>

    <h2>2. glTF（Draco 压缩，KHR_draco_mesh_compression）</h2>
    <div
      data-halo-3d-model="true"
      data-src="/fixtures/draco/Box.gltf"
      data-name="Box.gltf"
      data-width="100%"
      data-height="300px"
      data-theme="light"
      data-autorotate="false"
      data-background="solid"
      data-grid="true"
      data-controls="true"
      style="position:relative;display:block;width:100%;height:300px;overflow:hidden"
    ></div>

    <div id="report">运行中…</div>

    <script src="/plugins/PluginThreeD/assets/console/halo-3d-runtime.js"></script>
    <script>
      const logEl = document.getElementById("report");
      const lines = [];

      function log(text, cls) {
        lines.push(cls ? `<span class="${cls}">${text}</span>` : text);
        logEl.innerHTML = lines.join("\n");
        console.log("[formats] " + text);
      }

      window.addEventListener("error", (e) => {
        log("❌ 未捕获错误: " + e.message);
      });

      function report() {
        const hosts = Array.from(document.querySelectorAll("[data-halo-3d-model]"));
        let pass = 0;
        let fail = 0;

        hosts.forEach((host, index) => {
          const name = host.getAttribute("data-name") || "case-" + (index + 1);
          const canvas = host.querySelector("canvas");
          const overlay = host.querySelector(".halo-3d-model__overlay");
          const overlayText = overlay ? overlay.textContent.trim() : "";
          const isError = overlayText.includes("失败");

          if (canvas && !isError) {
            pass += 1;
            log(`✅ ${name}  渲染成功（canvas 已出现）`, "pass");
          } else {
            fail += 1;
            log(
              `❌ ${name}  canvas=${!!canvas}  提示="${overlayText}"`,
              "fail"
            );
          }
        });

        // 顺便确认解码器文件可访问
        const dracoWasm = document.createElement("div");
        dracoWasm.remove();

        log("");
        log(
          fail === 0
            ? `全部通过：${pass} 个模型 ✅`
            : `通过 ${pass} 个，失败 ${fail} 个 ❌`,
          fail === 0 ? "pass" : "fail"
        );
        window.__formatsResult = { pass, fail, done: true };
      }

      // 留足时间让模型下载 + 解码
      setTimeout(report, 6000);
    </script>
  </body>
</html>
