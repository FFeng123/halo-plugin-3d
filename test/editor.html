<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>halo-plugin-3d 编辑器集成测试</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }
      h1 {
        font-size: 18px;
      }
      #editor {
        margin: 16px 0;
        padding: 12px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
      }
      #log {
        margin-top: 16px;
        padding: 12px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        line-height: 1.9;
        white-space: pre-wrap;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
      }
      .pass {
        color: #047857;
      }
      .fail {
        color: #dc2626;
      }
      .note {
        max-width: 780px;
        font-size: 13px;
        line-height: 1.7;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <h1>halo-plugin-3d 编辑器集成测试</h1>
    <p class="note">
      验证「点击插入 3D 模型 → 节点立刻插入 → 节点内部直接出现选择模型文件面板」
      这条链路。整条链路<b>不涉及任何弹窗</b>：选择面板是节点视图的一部分，
      能渲染节点视图就一定能看到它。
    </p>

    <div id="editor"></div>
    <div id="log">运行中…</div>

    <script src="/vendor/vue/dist/vue.global.js"></script>
    <script>
      window.VueRouter = {
        useRouter: () => ({ push: () => {}, replace: () => {}, resolve: () => {} }),
      };
      window.VueUse = {
        useElementSize: () => ({ width: 0, height: 0 }),
        useThrottleFn: (fn) => fn,
      };
    </script>
    <!-- Halo 的编辑器包（真实 Tiptap） -->
    <script src="/vendor/@halo-dev/richtext-editor/dist/rich-text-editor.iife.js"></script>
    <!-- Halo 组件 -->
    <script src="/vendor/@halo-dev/components/dist/halo-components.iife.js"></script>
    <!-- Halo API 客户端打桩：附件查询返回测试数据 -->
    <script>
      window.HaloApiClient = {
        consoleApiClient: {
          storage: {
            attachment: {
              searchAttachments: async (params) => {
                if (window.Halo3DHarness) {
                  window.Halo3DHarness.apiCalls.push({
                    method: "searchAttachments",
                    params,
                  });
                }
                return {
                  data: {
                    total: window.Halo3DHarness
                      ? window.Halo3DHarness.mockAttachments.length
                      : 0,
                    items: window.Halo3DHarness
                      ? window.Halo3DHarness.mockAttachments
                      : [],
                  },
                };
              },
            },
          },
        },
        coreApiClient: { storage: { attachment: {} } },
      };
    </script>
    <script src="/harness/harness.js"></script>

    <script>
      const logEl = document.getElementById("log");
      const lines = [];
      let pass = 0;
      let fail = 0;

      function log(text, cls) {
        lines.unshift(cls ? `<span class="${cls}">${text}</span>` : text);
        logEl.innerHTML = lines.join("\n");
        console.log("[harness] " + text);
      }

      function check(name, condition, detail) {
        if (condition) {
          pass += 1;
          log("✅ " + name + (detail ? "  →  " + detail : ""), "pass");
        } else {
          fail += 1;
          log("❌ " + name + (detail ? "  →  " + detail : ""), "fail");
        }
        return condition;
      }

      window.addEventListener("error", (e) => {
        log("❌ 未捕获错误: " + e.message + " @ " + e.filename + ":" + e.lineno);
      });
      window.addEventListener("unhandledrejection", (e) => {
        log(
          "❌ 未处理的 Promise 拒绝: " +
            (e.reason && e.reason.stack ? e.reason.stack : e.reason)
        );
      });

      async function run() {
        const h = window.Halo3DHarness;
        if (!h) {
          log("❌ harness 没有加载");
          return;
        }

        log(
          "环境检查: Vue=" +
            (window.Vue ? "有" : "无") +
            " / RichTextEditor=" +
            (window.RichTextEditor ? "有" : "无") +
            " / HaloApiClient=" +
            (window.HaloApiClient ? "有" : "无")
        );

        // --- 1. 点击工具箱：节点必须立刻出现（同步，不 await 任何东西）---
        h.triggerToolboxInsert();

        const immediate = h.getModelNodes();
        check(
          "点击工具箱后节点立刻插入（同步，不需要等待任何弹窗）",
          immediate.length === 1,
          "节点数=" + immediate.length
        );

        // --- 2. 节点内部应该直接出现「选择模型文件」面板 ---
        await h.flush(50);
        const panel = document.querySelector(".halo-3d-pick");
        check("节点内部渲染出了选择文件面板", !!panel, panel ? "面板已出现" : "没找到 .halo-3d-pick");

        const panelTitle = panel?.querySelector(".halo-3d-pick__title")?.textContent?.trim();
        check("面板标题正确", panelTitle === "选择模型文件", String(panelTitle));

        // --- 3. 面板应该调用了 Halo 的附件接口并列出模型文件 ---
        const calls = h.getApiCalls();
        check(
          "面板调用了 Halo 的附件查询接口",
          calls.some((c) => c.method === "searchAttachments"),
          "调用次数=" + calls.length
        );

        const items = panel?.querySelectorAll(".halo-3d-pick__item") ?? [];
        check(
          "面板只列出模型文件（过滤掉 png）",
          items.length === 1,
          "列表项=" + items.length
        );
        const firstName = items[0]?.querySelector(".halo-3d-pick__name")?.textContent?.trim();
        check("列表里是 cube.obj", firstName === "cube.obj", String(firstName));

        // --- 4. 点击列表项 → 属性写入节点，面板收起 ---
        items[0]?.click();
        await h.flush(50);

        const afterPick = h.getModelNodes()[0] || {};
        check(
          "点击文件后节点的 src 被写入",
          afterPick.src === "/fixtures/cube.obj",
          String(afterPick.src)
        );
        check(
          "点击文件后节点的 name 被写入",
          afterPick.name === "cube.obj",
          String(afterPick.name)
        );
        check(
          "选完文件后面板自动收起",
          !document.querySelector(".halo-3d-pick"),
          "面板仍存在"
        );

        // --- 5. 3D 画布真正渲染 ---
        await h.flush(2500);
        const canvas = document.querySelector(".halo-3d-node-view canvas");
        check("节点里渲染出了 3D 画布", !!canvas, canvas ? "canvas 已出现" : "没有 canvas");
        const status = document.querySelector(".halo-3d-node-view__status");
        check(
          "没有报错提示",
          !status || !String(status.textContent).includes("失败"),
          status?.textContent?.trim() || "无状态提示"
        );

        // --- 6. 序列化结果 ---
        const html = h.editor.getHTML();
        check(
          "序列化 HTML 带 data-halo-3d-model",
          html.includes('data-halo-3d-model="true"'),
          ""
        );
        check(
          "序列化 HTML 带 data-src",
          html.includes('data-src="/fixtures/cube.obj"'),
          ""
        );

        // --- 7. 气泡菜单与设置面板 ---
        h.selectModelNode(0);
        const bubble = h.getBubbleMenuItems();
        check("气泡菜单有按钮", bubble.length > 0, "按钮数=" + bubble.length);

        const settingsItem = bubble.find((i) => i.props?.title === "设置");
        check("气泡菜单里有「设置」", !!settingsItem);
        if (settingsItem) {
          const comp = settingsItem.props.action({ editor: h.editor });
          check("「设置」返回组件（不用弹窗）", !!comp && typeof comp === "object", typeof comp);
        }

        const themeItem = bubble.find((i) => i.props?.title?.startsWith("主题"));
        if (themeItem) {
          themeItem.props.action({ editor: h.editor });
          await h.flush();
          const themed = h.getModelNodes()[0] || {};
          check("「主题」切换后属性变了", themed.theme === "light", "theme=" + String(themed.theme));
        } else {
          check("气泡菜单里有「主题」", false);
        }

        log("");
        log(
          fail === 0
            ? `全部通过：${pass} 项断言 ✅`
            : `通过 ${pass} 项，失败 ${fail} 项 ❌`,
          fail === 0 ? "pass" : "fail"
        );
        window.__harnessResult = { pass, fail, done: true };
      }

      run().catch((error) => {
        log("❌ 测试执行异常: " + (error && error.stack ? error.stack : error));
        window.__harnessResult = { pass, fail, done: true, error: String(error) };
      });
    </script>
  </body>
</html>
