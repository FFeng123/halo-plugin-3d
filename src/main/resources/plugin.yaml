# 插件清单，参见 https://docs.halo.run/developer-guide/plugin/basics/manifest
apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # 插件唯一 ID，同时也是控制台中 window.<name> 的全局变量名
  # 注意：必须是合法的 JavaScript 标识符（不能带短横线）
  name: PluginThreeD
spec:
  enabled: true
  requires: ">=2.21.7"
  version: 1.3.1
  # 插件图标：相对于 src/main/resources 的路径。
  # Halo 会把它解析成 /plugins/PluginThreeD/assets/logo.svg?version=<spec.version>
  logo: logo.svg
  author:
    name: FFeng123
    website: https://github.com/FFeng123
  homepage: https://github.com/FFeng123/halo-plugin-3d#readme
  repo: https://github.com/FFeng123/halo-plugin-3d
  issues: https://github.com/FFeng123/halo-plugin-3d/issues
  displayName: "3D 模型"
  description: "在文章中插入并渲染 3D 模型，支持 OBJ（带 MTL 材质）、FBX、GLB/GLTF（含 Draco / Meshopt / KTX2 压缩），基于 Three.js，支持亮色/暗色主题。"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/FFeng123/halo-plugin-3d/blob/main/LICENSE"
